name: Candidate verification
run-name: CodeMentor candidate verification ${{ inputs.candidate_sha }}

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact staged commit SHA
        required: true
        type: string

permissions:
  contents: read

jobs:
  candidate-syntax:
    name: candidate-syntax
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify and check out exact candidate SHA
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.inputs.candidate_sha }}
          fetch-depth: 0
          persist-credentials: false
          path: candidate
      - name: Check out trusted analysis tools
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: false
          path: trusted
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Verify dispatch identity
        env:
          EXPECTED_SHA: ${{ inputs.candidate_sha }}
        run: |
          test "$(git -C candidate rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Compile Python sources
        run: |
          python - <<'PY'
          import pathlib
          import sys

          files = [path for path in pathlib.Path('candidate').rglob('*.py')
                   if not any(part.startswith('.') for part in path.parts)
                   and '.venv' not in path.parts and 'node_modules' not in path.parts]
          for path in files:
              compile(path.read_bytes(), str(path), 'exec')
          print(f"Compiled {len(files)} Python files")
          PY

  candidate-static:
    name: candidate-static
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify and check out exact candidate SHA
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 0
          persist-credentials: false
          path: candidate
      - name: Check out trusted analysis tools
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          path: trusted
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Verify dispatch identity
        env:
          EXPECTED_SHA: ${{ inputs.candidate_sha }}
        run: |
          test "$(git -C candidate rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Analyze changed Python files
        run: |
          python - <<'PY'
          import pathlib
          import subprocess
          import sys
          sys.path.insert(0, 'trusted')
          from static_analysis import analyze_python, static_fingerprint_counts

          paths = subprocess.check_output(
              ['git', '-C', 'candidate', 'diff-tree', '--no-commit-id', '--name-only', '-r', 'HEAD'],
              text=True,
          ).splitlines()
          failed = False
          for name in paths:
              path = pathlib.Path('candidate') / name
              if path.suffix != '.py' or not path.is_file():
                  continue
              result = analyze_python(path.read_text(encoding='utf-8'), file_path=name)
              previous = subprocess.run(
                  ['git', '-C', 'candidate', 'show', f'HEAD^:{name}'], text=True, capture_output=True,
                  check=False,
              )
              baseline_source = previous.stdout if previous.returncode == 0 else ''
              baseline = analyze_python(baseline_source, file_path=name)
              introduced = static_fingerprint_counts(result) - static_fingerprint_counts(baseline)
              if result.status == 'errored' or introduced:
                  failed = True
                  print(f"{name}: parse status={result.status}; newly introduced findings={sum(introduced.values())}")
                  for finding in result.findings:
                      key = (finding.rule_id, finding.fingerprint)
                      if introduced[key]:
                          print(f"  {finding.rule_id} line {finding.line_start}: {finding.title}")
                          introduced[key] -= 1
                  if result.error_type:
                      print(f"  parse error at {result.error_line}:{result.error_column}: {result.error_type}")
          if failed:
              sys.exit(1)
          PY

  candidate-regression:
    name: candidate-regression
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      GROQ_API_KEY: ""
      GITHUB_CANDIDATE_STAGING_ENABLED: "false"
      GITHUB_AUTONOMOUS_COMMIT_ENABLED: "false"
    steps:
      - name: Verify and check out exact candidate SHA
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 0
          persist-credentials: false
          path: candidate
      - name: Check out trusted runner and test bundle
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          path: trusted
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Verify dispatch identity
        env:
          EXPECTED_SHA: ${{ inputs.candidate_sha }}
        run: |
          test "$(git -C candidate rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Build trusted test runner from default-branch sources
        env:
          PYTHON_BASE_IMAGE: ${{ vars.CODEMENTOR_VERIFIER_PYTHON_BASE_IMAGE }}
        run: |
          echo "$PYTHON_BASE_IMAGE" | grep -Eq '^python:3\.11-slim@sha256:[a-f0-9]{64}$'
          docker build --build-arg PYTHON_BASE_IMAGE="$PYTHON_BASE_IMAGE" \
            -f trusted/deploy/behavioral_executor/Dockerfile -t codementor-verifier:trusted trusted
      - name: Run independent regression suite in a restricted disposable container
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          python trusted/deploy/behavioral_executor/make_request.py candidate "$CANDIDATE_SHA" /tmp/codementor-request.json
          docker run --rm --network=none --read-only --cap-drop=ALL \
            --security-opt=no-new-privileges --user=65532:65532 --pids-limit=64 \
            --memory=2g --memory-swap=2g --cpus=1 --ulimit cpu=180:181 \
            --tmpfs /tmp:rw,nosuid,nodev,noexec,size=256m \
            -v /tmp/codementor-request.json:/input/request.json:ro \
            --log-driver=none codementor-verifier:trusted \
            python -I /opt/runner/runner.py /input/request.json
